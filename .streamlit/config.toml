# Оформление приложения. Акцентный цвет #2F74E0 подобран так, чтобы элементы были заметны
# и на белом фоне (контраст 4,47 : 1), и в тёмной теме (4,23 : 1).
# Цвет задан отдельно для светлой и тёмной темы: так сохраняется автоматическое
# переключение темы по настройкам устройства.
[theme.light]
primaryColor = "#2F74E0"

[theme.dark]
primaryColor = "#2F74E0"
